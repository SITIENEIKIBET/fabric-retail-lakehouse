services:
  postgres:
    image: postgres:16
    container_name: fabric-retail-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: retail_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: retail_source

    ports:
      - "5432:5432"

    volumes:
      - fabric_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_admin -d retail_source"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fabric_postgres_data: